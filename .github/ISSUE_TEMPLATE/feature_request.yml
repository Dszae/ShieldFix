name: Feature request
description: Suggest an idea or improvement for ShieldFix.
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you ran into.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: ShieldFix principles
      description: ShieldFix stays local-only, never weakens protection on its own, and never bypasses paywalls or logins.
      options:
        - label: This idea fits those principles.
          required: true
