<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: continuous DOM churn (performance)</title>
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <header class="site">Live Ticker</header>
    <main id="ticker"></main>
    <script>
      window.__longTasks = [];
      try {
        new PerformanceObserver((list) => {
          for (const e of list.getEntries()) window.__longTasks.push(Math.round(e.duration));
        }).observe({ type: 'longtask', buffered: false });
      } catch (e) {
        window.__longTasks = null;
      }
      const ticker = document.getElementById('ticker');
      let n = 0;
      setInterval(() => {
        for (let i = 0; i < 20; i++) {
          const p = document.createElement('p');
          p.textContent = 'Update #' + n++ + ' - scores and headlines';
          ticker.prepend(p);
        }
        while (ticker.children.length > 400) ticker.lastElementChild.remove();
        ticker.style.opacity = String(0.9 + Math.random() * 0.1);
      }, 100);
    </script>
  </body>
</html>
